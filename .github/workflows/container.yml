name: Container

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: node
            dockerfile: Dockerfile
            image_suffix: ""
          - variant: nginx
            dockerfile: Dockerfile.nginx
            image_suffix: -nginx
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' && matrix.variant == 'nginx' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test nginx image
        if: matrix.variant == 'nginx'
        env:
          TEST_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker pull "$TEST_IMAGE"
          fi

          docker network create pi-fleet-smoke
          docker run -d --name pi-fleet-upstream --network pi-fleet-smoke traefik/whoami:v1.11
          docker run -d --name pi-fleet-gateway --network pi-fleet-smoke -p 30141:30141 \
            -e 'PI_FLEET_CONFIG_JSON={"machines":[{"id":"test","name":"Test","api":{"url":"http://pi-fleet-upstream:80","headers":{"X-Fleet-Test":"passed"}}}]}' \
            "$TEST_IMAGE"

          cleanup() {
            docker rm -f pi-fleet-gateway pi-fleet-upstream >/dev/null 2>&1 || true
            docker network rm pi-fleet-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:30141/api/fleet/machines >/tmp/machines.json && break
            sleep 1
          done
          jq -e '.machines == [{"id":"test","name":"Test","enabled":true}]' /tmp/machines.json

          curl --fail --silent -H 'X-Pi-Machine: test' \
            http://127.0.0.1:30141/api/fleet/proxy/headers >/tmp/upstream.txt
          grep -q 'X-Fleet-Test: passed' /tmp/upstream.txt
          if grep -q 'X-Pi-Machine:' /tmp/upstream.txt; then
            echo 'routing header leaked to upstream' >&2
            exit 1
          fi

          curl --fail --silent \
            http://127.0.0.1:30141/api/fleet/events/test/headers >/tmp/events.txt
          grep -q 'X-Fleet-Test: passed' /tmp/events.txt
