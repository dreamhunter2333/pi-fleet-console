name: Fleet Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: fleet-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  ui:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          E2E_SERVER_MODE: start
      - run: node e2e/fleet.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fleet-ui-failure
          path: test-results/e2e/

  agents:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            asset: linux-x64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix agent --ignore-scripts
      - run: npm --prefix agent run typecheck
      - run: npm --prefix agent run build
        env:
          PI_FLEET_COMPILE_TARGET: ${{ matrix.target }}
      - run: npm --prefix agent test
      - name: Prepare binary and checksum
        env:
          ASSET: pi-fleet-agent-${{ matrix.asset }}
        run: |
          mv build/pi-fleet-agent "build/$ASSET"
          cd build
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: pi-fleet-agent-${{ matrix.asset }}
          path: build/pi-fleet-agent-*
          if-no-files-found: error

  container:
    needs: checks
    name: Build image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-nginx
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FLEET_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container

      - name: Smoke test image
        env:
          TEST_IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            docker pull "$TEST_IMAGE"
          fi

          docker network create pi-fleet-smoke
          docker run -d --name pi-fleet-upstream --network pi-fleet-smoke traefik/whoami:v1.11
          docker run -d --name pi-fleet-gateway --network pi-fleet-smoke -p 30141:30141 \
            -e 'PI_FLEET_CONFIG_JSON={"machines":[{"id":"test","name":"Test","api":{"url":"http://pi-fleet-upstream:80","headers":{"X-Fleet-Test":"passed"}}}]}' \
            "$TEST_IMAGE"

          cleanup() {
            docker rm -f pi-fleet-gateway pi-fleet-upstream >/dev/null 2>&1 || true
            docker network rm pi-fleet-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:30141/api/fleet/machines >/tmp/machines.json && break
            sleep 1
          done
          jq -e '.machines == [{"id":"test","name":"Test","enabled":true}]' /tmp/machines.json

          curl --fail --silent -H 'X-Pi-Machine: test' \
            http://127.0.0.1:30141/api/fleet/proxy/headers >/tmp/upstream.txt
          grep -q 'X-Fleet-Test: passed' /tmp/upstream.txt
          if grep -q 'X-Pi-Machine:' /tmp/upstream.txt; then
            echo 'routing header leaked to upstream' >&2
            exit 1
          fi

          curl --fail --silent \
            http://127.0.0.1:30141/api/fleet/events/test/headers >/tmp/events.txt
          grep -q 'X-Fleet-Test: passed' /tmp/events.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [agents, container, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pi-fleet-agent-*
          merge-multiple: true
          path: release
      - name: Attach binaries to the prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
