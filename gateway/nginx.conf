user nobody;
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

env PI_FLEET_CONFIG_FILE;
env PI_FLEET_CONFIG_JSON;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    lua_package_path "/etc/openresty/?.lua;;";
    init_by_lua_block {
        require("fleet").load()
    }

    resolver 127.0.0.11 ipv6=off valid=30s;

    server {
        listen 30141;
        server_name _;
        root /srv;

        location = /api/fleet/machines {
            content_by_lua_block {
                require("fleet").list()
            }
        }

        location /api/ {
            set $fleet_target "";
            set $fleet_host "";
            set $fleet_server_name "";

            access_by_lua_block {
                require("fleet").select()
            }

            proxy_pass $fleet_target;
            proxy_http_version 1.1;
            proxy_set_header Host $fleet_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_name $fleet_server_name;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_hide_header Set-Cookie;
        }

        location = /sw.js {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri =404;
        }

        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "private, no-cache, max-age=0, must-revalidate" always;
            try_files $uri $uri.html $uri/ /index.html;
        }
    }
}
